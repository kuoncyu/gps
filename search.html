<!doctype html><html lang="zh-Hant" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="離線優先的智慧車用導航（Demo 資料）"><meta name="theme-color" content="#1259c3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AI GPS"><title>搜尋 － AI GPS</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css">
<style>.sbox{width:100%;min-height:var(--touch);font:inherit;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}#results{list-style:none;padding:0;margin:12px 0}#results li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px}#chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}</style></head><body><a class="skip" href="#main">跳到主要內容</a><header id="statusbar"></header>
<main class="wrap" id="main"><h1>搜尋</h1>
<input id="q" class="sbox" type="search" placeholder="搜尋 POI 或地址，例如：咖啡、中山路 12 號、加油" aria-label="搜尋關鍵字" autocomplete="off">
<div class="btns" id="chips" role="group" aria-label="類別"></div>
<div class="btns" id="quick"></div>
<div class="btns"><label><input type="checkbox" id="along"> <span id="alongLbl">沿途搜尋（路線兩側 200 m）</span></label></div>
<div class="btns"><button id="nearPark">找最近停車場</button></div>
<div class="btns"><label>附近範圍 <select id="radius" class="sbox" style="width:auto"><option value="0">不限</option><option value="500">500 m</option><option value="1000">1 km</option><option value="2000">2 km</option></select></label></div>
<p id="status" class="muted" role="status" aria-live="polite"></p><ul id="results"></ul>
<p id="dest"></p><button id="clearDest">清除目的地</button>
<p class="muted">目前僅支援 POI 名稱／類別搜尋；地址搜尋、收藏與歷史將於後續批次加入。</p></main>
<script src="js/state.js"></script><script src="js/providers.js"></script><script src="js/demo.js"></script><script src="js/storage.js"></script><script src="js/package-manager.js"></script><script src="js/offline-manager.js"></script><script src="js/theme.js"></script><script src="js/search.js"></script><script src="js/places.js"></script><script src="js/search-page.js"></script><script src="js/pwa.js"></script><script src="js/app.js"></script></body></html>
