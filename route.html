<!doctype html><html lang="zh-Hant" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="離線優先的智慧車用導航（Demo 資料）"><meta name="theme-color" content="#1259c3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AI GPS"><title>路線 － AI GPS</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css">
<style>.sbox{width:100%;min-height:var(--touch);font:inherit;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}ul.l{list-style:none;padding:0;margin:8px 0}ul.l li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding:8px 0}label{display:block;min-height:36px}svg#pv{width:100%;max-height:340px;background:var(--bg);border-radius:10px}</style></head><body><a class="skip" href="#main">跳到主要內容</a><header id="statusbar"></header>
<main class="wrap" id="main"><h1>路線規劃</h1><p>起點：目前位置（Demo GPS）　目的地：<b id="dest"></b></p>
<div class="grid">
<section class="card"><h2>偏好與避開</h2><label><input type="radio" name="m" id="mFast"> 最快路線</label><label><input type="radio" name="m" id="mShort"> 最短路線</label>
<label><input type="checkbox" id="avoidHighway"> 避開高速公路</label><label><input type="checkbox" id="avoidToll"> 避開收費道路</label><label><input type="checkbox" id="avoidUnpaved"> 避開未鋪裝道路</label><label class="muted"><input type="checkbox" disabled> 避開渡輪（資料包無渡輪資料）</label></section>
<section class="card"><h2>途經點（最多 3 個）</h2><ul class="l" id="wps"></ul><input id="wq" class="sbox" type="search" placeholder="搜尋並加入途經點" aria-label="搜尋途經點" autocomplete="off"><ul class="l" id="wres"></ul><button id="skip">跳過下一個途經點</button></section>
<section class="card" style="grid-column:1/-1"><h2>候選路線</h2><p id="msg" role="status" aria-live="polite" class="muted"></p><p id="pick" role="status" aria-live="polite"></p><ul class="l" id="cands"></ul>
<svg id="pv" viewBox="-1100 -1100 2200 2200" role="img" aria-label="路線預覽"></svg><p class="muted">綠點：起點　橘點：途經點　紅點：目的地　深色線：選用路線</p></section>
</div></main>
<script src="js/state.js"></script><script src="js/providers.js"></script><script src="js/demo.js"></script><script src="js/storage.js"></script><script src="js/package-manager.js"></script><script src="js/offline-manager.js"></script><script src="js/theme.js"></script><script src="js/search.js"></script><script src="js/traffic.js"></script><script src="js/routing.js"></script><script src="js/gps.js"></script><script src="js/route-page.js"></script><script src="js/pwa.js"></script><script src="js/app.js"></script></body></html>
