<!doctype html><html lang="zh-Hant" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="離線優先的智慧車用導航（Demo 資料）"><meta name="theme-color" content="#1259c3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AI GPS"><title>天氣 － AI GPS</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css">
<style>ul.l{list-style:none;padding:0;margin:8px 0}ul.l li{display:flex;gap:12px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0;flex-wrap:wrap}ul.l li.now{font-weight:700;background:var(--bg)}ul.l li.past{color:var(--muted)}
.wchip{display:inline-block;color:#fff;border-radius:6px;padding:0 8px;font-size:14px;min-width:48px;text-align:center}.sel{min-height:var(--touch);font:inherit;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}</style></head><body><a class="skip" href="#main">跳到主要內容</a><header id="statusbar"></header>
<main class="wrap" id="main"><h1>天氣 <span class="demo-tag">DEMO 離線快照</span></h1><p id="asof"></p><p id="lvl" role="status"></p>
<div class="grid"><section class="card" id="cur"></section><section class="card" id="dest"></section><section class="card" id="along" style="grid-column:1/-1"></section>
<section class="card"><h2>未來 12 小時（目前所在區域）</h2><ul class="l" id="hourly"></ul></section><section class="card"><h2>各區概況</h2><ul class="l" id="zones"></ul>
<h2>開發測試</h2><label>模擬資料年齡 <select id="age" class="sel"><option value="1">1 小時</option><option value="8">8 小時（過時）</option><option value="48">2 天（嚴重過時）</option><option value="30">30 小時前（預報過期）</option></select></label></section></div></main>
<script src="js/state.js"></script><script src="js/providers.js"></script><script src="js/demo.js"></script><script src="js/storage.js"></script><script src="js/package-manager.js"></script><script src="js/offline-manager.js"></script><script src="js/theme.js"></script><script src="js/gps.js"></script><script src="js/weather.js"></script><script src="js/weather-page.js"></script><script src="js/pwa.js"></script><script src="js/app.js"></script></body></html>
