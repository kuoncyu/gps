<!doctype html><html lang="zh-Hant" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="離線優先的智慧車用導航（Demo 資料）"><meta name="theme-color" content="#1259c3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AI GPS"><title>我的地點 － AI GPS</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css">
<style>ul.l{list-style:none;padding:0;margin:8px 0}ul.l li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding:8px 0;flex-wrap:wrap}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}</style></head><body><a class="skip" href="#main">跳到主要內容</a><header id="statusbar"></header>
<main class="wrap" id="main"><h1>我的地點</h1><p id="msg" role="status" aria-live="polite" class="muted"></p>
<section class="card" id="detail" hidden style="margin-bottom:14px"><h2 id="dName"></h2><p id="dInfo" class="muted"></p><div class="row" id="dAct"></div><h3>停車資訊</h3><p id="dPark"></p><ul class="l" id="dNear"></ul></section>
<div class="grid">
<section class="card"><h2>家與公司</h2><ul class="l" id="hw"></ul><p class="muted">在 POI 詳情頁可設定家／公司。</p></section>
<section class="card"><h2>收藏</h2><ul class="l" id="fav"></ul></section>
<section class="card"><h2>最近目的地</h2><ul class="l" id="hist"></ul><div class="btns"><button id="clrHist">清除最近目的地</button></div></section>
<section class="card"><h2>隱私</h2><p class="muted">收藏、最近目的地、家與公司只儲存在此裝置的瀏覽器中，不會上傳。</p><div class="btns"><button id="clrAll">清除所有地點資料</button></div></section>
</div></main>
